services:
  # FastAPI Backend API Service (로컬 전용 · 비-GCP)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nextspot-api
    # 컨테이너는 8080(Dockerfile)을 리슨한다 → 호스트 8000 → 컨테이너 8080 매핑.
    ports:
      - "8000:8080"
    volumes:
      - ./apps/api:/app   # 코드 라이브 마운트 (모델은 부팅 시 Supabase Storage 에서 적재 — 로컬 pkl 없음)
    # 자격증명은 로컬 실행과 같은 파일(apps/api/.env)을 그대로 읽는다.
    # 예전처럼 environment: 에 자리표시자 기본값을 두면 pydantic-settings 가 환경변수를 .env 보다
    # 우선해서, 루트 .env 가 없을 때 가짜 URL·키로 "정상" 부팅하는 문제가 있었다(2026-09-04 정정).
    env_file:
      - ./apps/api/.env
    environment:
      - ENV=development
    restart: unless-stopped
