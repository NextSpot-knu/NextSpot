name: twa-debug-apk

# Play 출시용 Bubblewrap TWA(apps/twa)의 디버그 APK 를 만든다 — 서명키·Secrets 없이(디버그 키).
# 릴리스 서명·AAB·Play 업로드는 여기서 하지 않는다. assetlinks.json 이 없으면 앱 위에 주소창이 보이는 게 정상.
# workflow_dispatch 버튼은 이 파일이 기본 브랜치(main)에 있어야 Actions 화면에 생긴다 — 그 전에는 push 로 돈다.

on:
  push:
    branches: [feat/twa]
    paths:
      - 'apps/twa/**'
      - '.github/workflows/twa-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twa-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/twa
    steps:
      - uses: actions/checkout@v4

      # 커밋된 gradle-wrapper.jar 가 공식 배포본인지 확인한다.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 러너에는 Android SDK 가 깔려 있다(ANDROID_HOME). 빠진 플랫폼은 AGP 가 받는다.
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: List APK
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: nextspot-twa-debug-${{ github.sha }}
          path: apps/twa/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
