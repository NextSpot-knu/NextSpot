# NextSpot — 혼잡 예측 모델 학습 (후보 생성 · 승격 · 롤백)
# 매주 월 03:00 KST 에 검증된 관측으로 후보 모델을 만들어 Supabase Storage + model_registry 에 등록한다.
# 승격(promote)·롤백(rollback)은 workflow_dispatch 로 사람이 명시적으로 한다 — 자동 승격 없음(docs/MODEL_CARD.md).
# 필요한 GitHub Secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET, ADMIN_API_TOKEN
#   (뒤 둘은 train.py 가 app 설정을 import 할 때 부팅 검증에 걸리므로 플레이스홀더가 아니라 실제 값이 있어야 한다.)
# 주의: schedule 은 기본 브랜치(main)에서만 발화한다. 전체 시크릿·변수 목록: docs/DEPLOY_AND_ENV.md §4.
name: Train Recommendation Model

on:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 KST
  workflow_dispatch:
    inputs:
      action:
        description: candidate | promote | rollback | dry-run
        required: true
        default: candidate
        type: choice
        options: [candidate, promote, rollback, dry-run]
      version:
        description: promote/rollback target version
        required: false
        type: string

permissions:
  contents: read

# 학습과 승격이 겹치면 registry 상태가 꼬인다 — 직렬화.
concurrency:
  group: recommendation-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Validate inputs
        shell: bash
        run: |
          action="${{ github.event.inputs.action || 'candidate' }}"
          version="${{ github.event.inputs.version }}"
          if [[ "$action" =~ ^(promote|rollback)$ && -z "$version" ]]; then
            echo "version is required for $action" >&2
            exit 2
          fi
      - name: Create candidate
        if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'candidate' }}
        run: python scripts/train.py
      - name: Dry run
        if: ${{ github.event.inputs.action == 'dry-run' }}
        run: python scripts/train.py --dry-run
      - name: Promote candidate
        if: ${{ github.event.inputs.action == 'promote' }}
        run: python scripts/train.py --promote-version "${{ github.event.inputs.version }}"
      - name: Roll back
        if: ${{ github.event.inputs.action == 'rollback' }}
        run: python scripts/train.py --rollback-version "${{ github.event.inputs.version }}"
