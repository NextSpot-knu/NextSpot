# NextSpot — TourAPI 일배치 인제스트
# 매일 UTC 19:00(KST 04:00, 관광객 트래픽 최저 시간)에 황리단길 POI 를 Supabase facilities 에 upsert 한다.
# 주의: schedule 트리거는 기본 브랜치(main)에서만 발화한다 — feature 브랜치 머지 전에는
#       workflow_dispatch 로 수동 실행할 것 (Actions 탭 → TourAPI Ingest → Run workflow).
# 필요한 GitHub Secrets (repo → Settings → Secrets and variables → Actions → Secrets):
#   TOURAPI_KEY, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, KAKAO_REST_API_KEY, LOCALDATA_AUTH_KEY(선택)
# 선택 Repository Variable: KAKAO_PLACE_DISCOVERY_ENABLED=true (TourAPI 가 놓친 카페·식당을 Kakao 로 보완 적재)
# 선택 Repository Variable: TOURAPI_INSIGHTS_ENABLED=true (집중률 15128555 승인 후)
# 선택 Repository Variable: TOURAPI_RELATED_ENABLED=true (연관관광지 별도 상품 승인 후)
# 선택: 경주 메뉴별음식점 보강 — Secret GYEONGJU_FOOD_API_KEY + Variable GYEONGJU_FOOD_API_BASE_URL
#       + Variable GYEONGJU_FOOD_ENABLED=true (15114465 활용신청 승인 후)
# TOURAPI_KEY 가 없으면 TourAPI 단계만 skip 한다. TOURAPI/LOCALDATA/KAKAO 키가 전부 없으면 checkout 도 하지 않는다
# (무해 — 매일 실패 이메일 방지). 전체 시크릿·변수 목록: docs/DEPLOY_AND_ENV.md §4.
#
# 실패 대응(2026-09-24): 09-15·19·20·22 실패는 전부 첫 locationBasedList2 가 10초 만에 타임아웃한 것이다.
# 같은 러너에서 곧이어 돈 경주 음식점 호출(같은 apis.data.go.kr)도 타임아웃했고, 몇 분 뒤 새 러너의
# 재실행은 성공했다 — 스크립트·키·쿼터가 아니라 그 러너에서 apis.data.go.kr 로 가는 경로 문제다.
#   1) 스크립트: 목록 호출을 일시 실패에 한해 최대 4회(약 2분) 재시도한다(ingest_tourapi.py).
#   2) 그래도 실패하면 retry 잡이 새 러너로 이 워크플로를 다시 띄운다(스케줄 실행에서 시작해 최대 2회).
#   3) 재시도를 다 써도 실패하면 alert 잡이 이슈를 열거나 기존 열린 이슈에 댓글을 단다.
name: TourAPI Ingest

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      auto_retry:
        description: '자동 재시도 회차 — 사람은 비워 둔다(스케줄 실패 시 retry 잡이 1·2 를 채운다)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# 동시 실행 방지 — 수동 실행과 스케줄이 겹쳐도 upsert 가 경합하지 않도록 직렬화.
concurrency:
  group: tourapi-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest (TourAPI → facilities)
    runs-on: ubuntu-latest
    # 25분 = 준비(~2분) + TourAPI 스텝 상한 15분 + 경주 음식점 스텝 상한 5분 + 여유.
    # 잡 timeout 에 걸리면 결과가 cancelled 라 retry·alert 가 돌지 않으므로 스텝 상한 합보다 크게 둔다.
    timeout-minutes: 25
    env:
      TOURAPI_KEY_CONFIGURED: ${{ secrets.TOURAPI_KEY }}
      LOCALDATA_AUTH_KEY_CONFIGURED: ${{ secrets.LOCALDATA_AUTH_KEY }}
      KAKAO_REST_API_KEY_CONFIGURED: ${{ secrets.KAKAO_REST_API_KEY }}
      GYEONGJU_FOOD_CONFIGURED: ${{ secrets.GYEONGJU_FOOD_API_KEY }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      # secrets 컨텍스트는 if 에서 직접 참조할 수 없어 job env 를 통한 2-스텝 가드를 사용한다.
      # checkout/setup-python 까지 가드 뒤에 두어 키 미설정 시 낭비를 없앤다.
      - name: Skip (TOURAPI_KEY 미설정)
        if: ${{ env.TOURAPI_KEY_CONFIGURED == '' }}
        # checkout 전에는 apps/api 가 없으므로 기본 working-directory 를 덮어쓴다.
        working-directory: .
        run: echo "TOURAPI_KEY secret 이 설정되지 않아 인제스트를 건너뜁니다."

      - uses: actions/checkout@v5
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' || env.LOCALDATA_AUTH_KEY_CONFIGURED != '' || env.KAKAO_REST_API_KEY_CONFIGURED != '' || env.GYEONGJU_FOOD_CONFIGURED != '' }}

      - uses: actions/setup-python@v6
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' || env.LOCALDATA_AUTH_KEY_CONFIGURED != '' || env.KAKAO_REST_API_KEY_CONFIGURED != '' || env.GYEONGJU_FOOD_CONFIGURED != '' }}
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - run: pip install -r requirements.txt
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' || env.LOCALDATA_AUTH_KEY_CONFIGURED != '' || env.KAKAO_REST_API_KEY_CONFIGURED != '' || env.GYEONGJU_FOOD_CONFIGURED != '' }}

      # --details: POI 당 상세(운영시간·배리어프리·개요) 호출 추가 — 상세 4콜/장소 × ~90곳 ≈ 360콜(일 쿼터 내).
      # --radius 3000: 2026-07-17 확장(황리단길 도보 회랑) — 기본 2000 으로 두면 일배치가 확장분 상세를 안 돈다.
      # 스텝 timeout — 잡 timeout(25분)에 걸리면 결과가 cancelled 라 아래 retry·alert 가 안 돈다.
      # 정상 소요는 2~3분이다. 상세 조회 중 망이 끊겨 건별 10초 타임아웃이 쌓여도 failure 로 끝나게 한다.
      - run: python scripts/ingest_tourapi.py --details --radius 3000
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' }}
        timeout-minutes: 15
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 인제스트는 인증·관리자 토큰 미사용 — Settings(부팅) 검증 통과용 플레이스홀더 (ci.yml 과 동일).
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

      # TourAPI가 놓치는 실제 카페·식당을 Kakao 장소 ID·주소·좌표 묶음으로 보완한다.
      # 별도 스키마 변경 없이 features.kakao_place_id로 재실행 중복을 막는다.
      - name: Discover relevant Kakao cafes and restaurants
        if: ${{ env.KAKAO_REST_API_KEY_CONFIGURED != '' && vars.KAKAO_PLACE_DISCOVERY_ENABLED == 'true' }}
        run: python scripts/ingest_kakao_places.py --apply --report ../../scratch/kakao_places.json
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

      # KorService2와 별도 상품이다. 승인 전 403으로 정기 배치를 깨지 않도록 명시적 변수로 게이트한다.
      # 연관관광지는 또 다른 승인 상품이므로 이 단계에 섞지 않는다.
      - name: Ingest tourism concentration forecasts
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' && vars.TOURAPI_INSIGHTS_ENABLED == 'true' }}
        run: python scripts/ingest_tourism_insights.py --dataset concentration
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

      - name: Ingest related attractions
        if: ${{ env.TOURAPI_KEY_CONFIGURED != '' && vars.TOURAPI_RELATED_ENABLED == 'true' }}
        run: python scripts/ingest_tourism_insights.py --dataset related
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

      # TourAPI와 독립된 공공 인허가 변경분 동기화. 최초/7일 초과 공백은 스크립트가
      # fail-closed하며 baseline 재수집을 요구한다.
      - name: Sync LOCALDATA restaurant licenses
        if: ${{ env.LOCALDATA_AUTH_KEY_CONFIGURED != '' }}
        run: python scripts/ingest_localdata.py delta --apply --report ../../scratch/localdata_delta.json
        env:
          LOCALDATA_AUTH_KEY: ${{ secrets.LOCALDATA_AUTH_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

      # 경주 메뉴별음식점(15114465)으로 음식점 시설의 대표메뉴·영업시간·주차를 features 로 보강.
      # TOURAPI(B551011)와 다른 활용신청이라 자체 base URL·키로 게이트한다(승인 전 정기 배치 보호).
      # !cancelled() — 앞선 TourAPI 적재 스텝이 간헐 실패(약 1/4)해도 독립 데이터원인 이 보강은 돌린다.
      - name: Enrich facilities with Gyeongju restaurant menus
        if: ${{ !cancelled() && env.GYEONGJU_FOOD_CONFIGURED != '' && vars.GYEONGJU_FOOD_ENABLED == 'true' }}
        # 이 스텝의 '0건 수신' 실패(2026-09-20·21·22)는 데이터가 빈 게 아니라 같은 러너에서 apis.data.go.kr
        # 연결이 10초 타임아웃된 것이다(로그 gyeongju_food_fetch_failed error= 공란, 같은 실행의 TourAPI 도 타임아웃).
        # 연결되는 러너에서는 매번 108건을 받았다(09-20·21·23 실측).
        # 그래서 서비스가 요청 타임아웃 25초 + 타임아웃·연결 끊김에 한해 5·15초 간격 재시도를 한다
        # (gyeongju_restaurant_service.py). 최악 약 3분 — 스텝 상한 5분으로 잡 timeout 을 넘지 않게 한다.
        # 독립 보강 데이터라 실패해도 본 배치(TourAPI 동기화·신선도 배지)는 살아야 한다 → non-fatal.
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ingest_gyeongju_restaurants.py
        env:
          GYEONGJU_FOOD_API_BASE_URL: ${{ vars.GYEONGJU_FOOD_API_BASE_URL }}
          GYEONGJU_FOOD_API_KEY: ${{ secrets.GYEONGJU_FOOD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

  # 실패한 러너는 몇 분간 apis.data.go.kr 에 닿지 못했다 — 같은 러너에서 버티지 말고 새 러너로 다시 돈다.
  # 스케줄 실행 → auto_retry=1 → auto_retry=2 까지(총 3회). 사람이 수동 실행한 것은 재시도하지 않는다.
  # GITHUB_TOKEN 이 만든 이벤트는 새 실행을 만들지 않지만 workflow_dispatch 는 예외라 여기서 쓸 수 있다.
  # 위 concurrency 그룹 때문에 새 실행은 이 실행이 끝난 뒤 시작한다.
  retry-on-fresh-runner:
    name: retry (새 러너에서 다시 실행)
    needs: ingest
    if: ${{ failure() && (github.event_name == 'schedule' || inputs.auto_retry == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch a fresh ingest run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_ATTEMPT: ${{ github.event_name == 'schedule' && '1' || '2' }}
        run: |
          gh workflow run ingest.yml --ref "$GITHUB_REF_NAME" -f auto_retry="$NEXT_ATTEMPT"
          echo "새 러너 재시도 ${NEXT_ATTEMPT}/2 를 예약했습니다." >> "$GITHUB_STEP_SUMMARY"

  # 재시도를 다 썼거나(수동 실행·auto_retry=2) 재시도 예약 자체가 실패하면 이슈로 알린다.
  # 같은 제목의 열린 이슈가 있으면 댓글만 단다 — 매일 새 이슈가 쌓이지 않게. 복구되면 사람이 닫는다.
  alert:
    name: alert (인제스트 실패 이슈)
    needs: [ingest, retry-on-fresh-runner]
    if: ${{ always() && needs.ingest.result == 'failure' && needs.retry-on-fresh-runner.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the ingest failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          AUTO_RETRY: ${{ inputs.auto_retry }}
        run: |
          set -euo pipefail
          title="TourAPI 일배치 인제스트 실패"
          body="$(printf '%s\n\n- 실행: %s\n- 트리거: %s (auto_retry=%s)\n- 시각(UTC): %s\n\n%s' \
            "TourAPI 일배치가 자동 재시도 후에도 실패했습니다. 시설 데이터가 오늘 갱신되지 않았습니다." \
            "$RUN_URL" "$TRIGGER" "${AUTO_RETRY:--}" "$(date -u '+%Y-%m-%d %H:%M')" \
            "확인: 실행 로그의 tourapi_request_failed(error_type) 줄. 복구 후 Actions → TourAPI Ingest → Run workflow 로 다시 돌리고 이 이슈를 닫는다.")"
          number="$(gh issue list --state open --search "in:title ${title}" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "::error::TourAPI 일배치 실패 — 이슈로 알렸습니다 ($RUN_URL)"
