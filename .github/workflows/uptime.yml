# NextSpot API — 수동 헬스체크 / keep-warm 핑
# Render 플랜을 유료(always-on)로 올렸으므로 인스턴스가 무요청으로 잠들지 않는다 →
# 예약(schedule) keep-warm 은 더 이상 필요 없어 제거했다(불필요한 Actions 분 소모·정시 미보장 cron 회피).
# 두 잡 모두 필요할 때 Actions 탭에서 수동(workflow_dispatch)으로 돌린다:
#  1) keep-warm: /health 를 한 번 깨운다(배포 직후 워밍업 등).
#  2) health-check: repository variable BACKEND_HEALTH_URL 로 임의 배포를 확인.
#     미설정이면 스텝 skip(무해). 값 등록: Settings → Secrets and variables → Actions → Variables
#     → BACKEND_HEALTH_URL = https://<render-서비스>.onrender.com/health (docs/DEPLOY_AND_ENV.md §4)
name: Backend Uptime Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-warm:
    name: keep-warm ping (/health)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint to prevent cold starts
        # 콜드스타트가 깨어날 여유(최대 120s)를 주고 부팅 중 일시 오류는 재시도한다.
        run: curl -fsS --retry 3 --retry-all-errors --max-time 120 https://nextspot-api.onrender.com/health

  health-check:
    name: health check (/health)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        if: ${{ vars.BACKEND_HEALTH_URL != '' }}
        run: curl -fsS --retry 2 --retry-all-errors --max-time 90 "${{ vars.BACKEND_HEALTH_URL }}"

      - name: Skip (BACKEND_HEALTH_URL 미설정)
        if: ${{ vars.BACKEND_HEALTH_URL == '' }}
        run: echo "BACKEND_HEALTH_URL repository variable 이 설정되지 않아 헬스체크를 건너뜁니다."
