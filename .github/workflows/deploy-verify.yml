# NextSpot API 배포 확인 — main 에서 apps/api 를 마지막으로 바꾼 커밋이 운영 /health 의 deploy.commit 에 떴는지 본다.
# Render 는 빌드가 실패하거나 Build Filters 로 건너뛰면 실행 중인 옛 배포를 그대로 두고, 성공 메일은 알림 설정에 따라
# 오지 않는다 — 그래서 '최신 API 가 안 떴다'는 사실이 아무 신호 없이 묻힐 수 있었다(10-09 빌드 실패 메일 뒤 확인 불가).
# 운영 커밋이 그 커밋이거나 그 뒤의 커밋이면 통과, 25분 안에 그렇게 되지 않으면 실패한다.
#
# 지금은 수동(workflow_dispatch)만이다. main 푸시마다 자동으로 돌리려면 먼저 Render 서비스의 Auto-Deploy 가
# 'On Commit' 인지 확인해야 한다 — 'After CI Checks Pass' 면 Render 는 이 잡을 포함한 커밋의 Actions 검사가 끝나기를
# 기다리고, 이 잡은 Render 배포를 기다려 둘이 서로 막는다(10-12 독립 리뷰). 확인되면 아래 push 트리거를 켠다.
# 같은 이유로 'After CI Checks Pass' 에서는 API 푸시 직후 이 잡을 수동으로 돌리지 않는다.
# 커밋 메시지의 [skip render] 류(Render 가 배포를 건너뜀) 커밋과 apps/api 의 시험·문서만 바꾼 커밋은 확인 대상에서 뺀다.
name: API Deploy Verify

on:
  workflow_dispatch:
  # push:              # Render Auto-Deploy 가 'On Commit' 으로 확인된 뒤에 켠다(위 설명).
  #   branches: [main]
  #   paths:
  #     - "apps/api/**"

permissions:
  contents: read

concurrency:
  group: deploy-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 다른 워크플로와 같은 API 주소 변수. 비어 있으면 확인하지 않는다(정지 예정인 오리건으로 넘어가지 않게).
      API_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Wait until the live API runs the latest API commit on main
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::warning::Repository Variable BACKEND_HEALTH_URL 이 비어 있어 배포 확인을 건너뛴다."
            exit 0
          fi
          skip_re='\[(skip (render|deploy|cd)|(render|deploy|cd) skip)\]'
          target=""
          for h in $(git log --format=%H HEAD -- apps/api ':(exclude)apps/api/tests' ':(exclude)apps/api/*.md'); do
            msg=$(git log -1 --format=%B "$h")
            if ! grep -qiE "$skip_re" <<<"$msg"; then target="$h"; break; fi
          done
          if [ -z "$target" ]; then
            echo "::warning::main 에서 apps/api 를 바꾼 커밋을 찾지 못했다."
            exit 0
          fi
          echo "target: $(git log -1 --format='%h %s' "$target")"
          deadline=$(( $(date +%s) + 25 * 60 ))
          live=""
          service=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 20 "$API_HEALTH_URL" || true)
            live=$(printf '%s' "$body" | jq -r '.deploy.commit // empty' 2>/dev/null || true)
            service=$(printf '%s' "$body" | jq -r '.deploy.service // empty' 2>/dev/null || true)
            full=""
            if [ -n "$live" ]; then full=$(git rev-parse --verify -q "${live}^{commit}" || true); fi
            if [ -n "$full" ] && { [ "$full" = "$target" ] || git merge-base --is-ancestor "$target" "$full"; }; then
              echo "live: ${service:-unknown} @ $live (target ${target:0:12} 포함)"
              exit 0
            fi
            echo "waiting: live=${live:-unknown} target=${target:0:12}"
            sleep 30
          done
          echo "::error::운영 API(${API_HEALTH_URL})가 25분 안에 ${target:0:12}(또는 그 뒤 커밋)로 바뀌지 않았다 — 지금 ${service:-알 수 없는 서비스} @ ${live:-알 수 없음}. Render 대시보드 → 서비스 → Events 에서 빌드 실패·건너뜀(Build Filters 경로)을 확인한다."
          exit 1
