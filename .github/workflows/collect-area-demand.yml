# NextSpot — 경주시 ITS 실측 주차 스냅샷 수집
# 정기 수집은 Supabase Cron이 담당한다. 이 workflow는 장애 시 운영자가 누르는 수동 복구 경로다.
# 필요한 설정:
#   Repository Variable BACKEND_HEALTH_URL=https://<render-service>.onrender.com/health
#   Repository Variable AREA_DEMAND_COLLECTION_ENABLED=true (원격 migration 적용 후 활성화)
#   Actions Secret SERVICE_API_TOKEN=<Render의 동일 SERVICE_API_TOKEN>
#     (아직 SERVICE_API_TOKEN 을 두지 않았다면 기존 ADMIN_API_TOKEN 시크릿이 그대로 쓰인다)
name: Collect Area Demand Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-demand-snapshot-collector
  cancel-in-progress: false

jobs:
  collect:
    name: collect current Gyeongju ITS snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLECTION_ENABLED: ${{ vars.AREA_DEMAND_COLLECTION_ENABLED }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      SERVICE_TOKEN: ${{ secrets.SERVICE_API_TOKEN || secrets.ADMIN_API_TOKEN }}
    steps:
      - name: Ping backend health endpoint
        if: ${{ env.BACKEND_HEALTH_URL != '' }}
        shell: bash
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 90 "${BACKEND_HEALTH_URL}"

      - name: Collect snapshot
        if: ${{ env.COLLECTION_ENABLED == 'true' && env.BACKEND_HEALTH_URL != '' && env.SERVICE_TOKEN != '' }}
        shell: bash
        run: |
          api_base="${BACKEND_HEALTH_URL%/health}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST "${api_base}/api/v1/area-demand/snapshots/collect" \
            -H "X-Service-Token: ${SERVICE_TOKEN}"

      - name: Fail (required setting missing)
        if: ${{ env.COLLECTION_ENABLED == 'true' && (env.BACKEND_HEALTH_URL == '' || env.SERVICE_TOKEN == '') }}
        run: |
          echo "BACKEND_HEALTH_URL variable 또는 SERVICE_API_TOKEN/ADMIN_API_TOKEN secret이 없어 수집할 수 없습니다."
          exit 1

      - name: Skip (collection not enabled)
        if: ${{ env.COLLECTION_ENABLED != 'true' }}
        run: echo "AREA_DEMAND_COLLECTION_ENABLED가 true가 아니어서 수집을 시작하지 않습니다."
