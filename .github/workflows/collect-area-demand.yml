# NextSpot — 경주시 ITS 실측 주차 스냅샷 수집
# GitHub 스케줄은 지연될 수 있으므로 API가 실제 실행 시각을 15분 버킷으로 정규화해 멱등 저장한다.
# 필요한 설정:
#   Repository Variable BACKEND_HEALTH_URL=https://<render-service>.onrender.com/health
#   Repository Variable AREA_DEMAND_COLLECTION_ENABLED=true (원격 migration 적용 후 활성화)
#   Actions Secret ADMIN_API_TOKEN=<Render의 동일 ADMIN_API_TOKEN>
name: Collect Area Demand Snapshots

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-demand-snapshot-collector
  cancel-in-progress: false

jobs:
  collect:
    name: collect current Gyeongju ITS snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLECTION_ENABLED: ${{ vars.AREA_DEMAND_COLLECTION_ENABLED }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - name: Collect snapshot
        if: ${{ env.COLLECTION_ENABLED == 'true' && env.BACKEND_HEALTH_URL != '' && env.ADMIN_API_TOKEN != '' }}
        shell: bash
        run: |
          api_base="${BACKEND_HEALTH_URL%/health}"
          curl --fail --silent --show-error --max-time 90 "${BACKEND_HEALTH_URL}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST "${api_base}/api/v1/area-demand/snapshots/collect" \
            -H "X-Admin-Authorization: Bearer ${ADMIN_API_TOKEN}"

      - name: Fail (required setting missing)
        if: ${{ env.COLLECTION_ENABLED == 'true' && (env.BACKEND_HEALTH_URL == '' || env.ADMIN_API_TOKEN == '') }}
        run: |
          echo "BACKEND_HEALTH_URL variable 또는 ADMIN_API_TOKEN secret이 없어 수집할 수 없습니다."
          exit 1

      - name: Skip (collection not enabled)
        if: ${{ env.COLLECTION_ENABLED != 'true' }}
        run: echo "AREA_DEMAND_COLLECTION_ENABLED가 true가 아니어서 수집을 시작하지 않습니다."
