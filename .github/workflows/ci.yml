# NextSpot CI — 게이트 정본은 AGENTS.md "검증 게이트" (여기와 같아야 한다)
# web: lint → typecheck → 단위테스트(check-i18n-keys + lib/**/*.test.ts) → 정적 export 빌드
# api: ruff → pytest (Python 3.11, Dockerfile 과 동일 버전)
# schema · docs: RESET_AND_SETUP.sql 이 migrations/ 와 일치하는지 + 문서 트리 규칙(scripts/check-docs.mjs)
# e2e: Playwright Chromium 390px · 4로케일 — 결정적(실계정·GPS·지도 SDK·외부 네트워크 없이)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 PR/브랜치의 새 커밋이 오면 낡은 CI를 취소해 고아 러너가 Actions 슬롯을 점유하지 않게 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run typecheck --workspace=apps/web
      - run: npm run test --workspace=apps/web
      # 정적 export 빌드 — 클라이언트 코드는 env 부재 시 플레이스홀더 폴백을 갖고 있어 키 없이 빌드 가능.
      - run: npm run build --workspace=apps/web

  api:
    name: api (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      # 단위테스트는 네트워크/실DB 미사용. Settings(부팅) 필수 env 는 플레이스홀더로 충족.
      - run: pytest -q
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          JWT_SECRET: ci-placeholder-jwt-secret
          ADMIN_API_TOKEN: ci-placeholder-admin-token

  schema:
    name: schema · docs (RESET ↔ migrations 일치 · 문서 트리 규칙)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # RESET_AND_SETUP.sql 은 자동 생성 산출물 — 재생성 결과가 커밋본과 다르면 실패.
      # 실패 시: RESET 이 migrations 와 불일치 — `node scripts/build_reset.mjs` 재실행 후 커밋할 것.
      #          (RESET_AND_SETUP.sql 을 직접 수정했다면 되돌리고 migrations/ 에 반영할 것.)
      - run: node scripts/build_reset.mjs
      - run: git diff --exit-code supabase/RESET_AND_SETUP.sql
      # 문서 트리 규칙 — docs/README.md 색인 완전성 · 상대 링크 해석 · 루트 마크다운 허용 목록 · HANDOVER 세션 제목 형식/길이.
      - run: node scripts/check-docs.mjs

  e2e:
    name: e2e (Chromium · 390px · 4 locales)
    runs-on: ubuntu-latest
    # 정상 실행은 약 4분. 러너/apt 통신이 끊겨도 GitHub 기본 6시간까지 매달리지 않게 제한한다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: Start deterministic web server
        run: npm run dev --workspace=apps/web -- --hostname 127.0.0.1 --port 3100 > /tmp/nextspot-web.log 2>&1 &
      - name: Wait for web server
        run: for i in {1..60}; do curl -fsS http://127.0.0.1:3100 >/dev/null && exit 0; sleep 1; done; cat /tmp/nextspot-web.log; exit 1
      - run: npm run test:e2e --workspace=apps/web
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
