# NextSpot — 주차 실측 수집이 죽으면 알린다
#
# 왜 필요한가: 정기 수집은 Supabase pg_cron 이 net.http_post 로 **발사 후 잊는** 구조다.
# API 가 401 을 주든 500 을 주든 cron.job_run_details 에는 succeeded 로 남으므로, 수집이
# 며칠 멈춰도 아무도 모른다. 실제로 그 상태를 눈으로 구분할 수 없어 한 번 오진했다
# (2026-09-06 — 예보의 오래된 표본을 수집 중단으로 잘못 읽었다).
#
# 그래서 '스케줄러가 돌았는가' 가 아니라 **새 스냅샷이 실제로 쌓였는가** 를 본다.
# 그 신호 하나면 원인이 무엇이든(토큰 불일치·Render 다운·cron 해제·Supabase 정지) 잡힌다.
#
# 실패하면 GitHub 이 워크플로 실패 알림(메일)을 보낸다 — 그것이 알림의 전부다. 공개 저장소라 이슈는
# 열지 않는다(실패 내용이 누구에게나 보인다).
#
# 어디서 보나(2026-09-28 변경): **데이터 평면**. Supabase PostgREST 로 area_demand_snapshots 의 최신 행
# 하나를 직접 읽는다. 예전에는 API(`/admin/area-demand-reliability`)에 물었는데, 그 답은 API 메모리 상태에
# 묶여 있었다 — 512MB 인스턴스가 부하를 내려놓는 503 한 번이 JSON 파싱 오류가 되어 '수집 멈춤' 거짓 경보가
# 났다(09-26 16:21). 수집이 쌓였는지는 스냅샷 표가 가장 잘 안다. 판정 기준은 API 와 같다
# (source=gyeongju_its · 10분 버킷 · 최신 observed_at 이 35분보다 오래면 멈춤 —
#  apps/api/app/services/area_demand_reliability_service.py 의 _ALERT_DOWN_AFTER_MINUTES).
#   ok               최신 스냅샷이 35분 안
#   no_snapshot      200 인데 행이 0개 → 실패. 운영 표에는 8월부터 행이 있으므로 '비었다'는 신규 환경이 아니라
#                    읽기가 어긋났다는 뜻이다 — service_role 이 아닌 키(RLS 가 켜져 있고 정책이 없어 오류 없이
#                    0행), source·bucket_minutes 값 변경, 또는 표를 비운 사고.
#   unknown          행이 0개인데 Repository Variable AREA_DEMAND_ALERT_ALLOW_EMPTY=true(갓 만든 환경) — 경보 아님
#   stale            최신 스냅샷이 35분보다 오래됨 → 실패
#   api_unreachable  Supabase 가 재시도 뒤에도 200 을 주지 않음(본문이 중간에 끊긴 응답 포함) → 실패. 수집 멈춤과
#                    다른 문제라 따로 말한다(401 = 시크릿 값, 5xx·연결 실패 = Supabase 상태). 시크릿에 HTTP 로 보낼 수
#                    없는 글자(붙여 넣을 때 딸려 온 U+200B 등)가 있으면 요청 전에 invalid_key_chars·invalid_url_chars 로
#                    멈춘다 — 로그에는 그 글자의 위치와 코드포인트만 남는다.
# API 판정에 있던 degraded(창 안 누락 버킷 20% 초과, 경고만·실패 아님)는 여기서 보지 않는다 — 관제 화면
# (area-demand-reliability)에 그대로 있다.
#
# 필요한 설정:
#   Actions Secret SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY — ingest.yml 이 이미 쓰는 값. 표에 RLS 가 켜져
#                  있어 service_role 키로 읽는다(로그에서는 GitHub 이 가린다 — 스크립트도 키·URL 을 출력하지 않는다).
#   Repository Variable AREA_DEMAND_ALERT_ALLOW_EMPTY=true — 스냅샷이 아직 없는 새 환경에서만. 운영에는 두지 않는다.
#   두 시크릿이 없으면 예전 방식(API 판정) 그대로 돈다:
#     Repository Variable BACKEND_HEALTH_URL=https://<render-service>.onrender.com/health
#     Actions Secret      SERVICE_API_TOKEN (없으면 ADMIN_API_TOKEN 을 그대로 쓴다)
#   그것마저 없으면 skip 한다 — 설정이 없다고 매시간 실패 메일을 보내면 그것부터 무시하게 된다.
name: Area Demand Collection Alert

on:
  schedule:
    # 매시 28분에 예약하지만 GitHub 스케줄러는 best-effort 다 — 발화가 늦거나 빠지고, 실측(09-20~09-28
    # 실행 이력)으로는 3~6시간 간격으로만 돌았다. 그래서 '멈춘 뒤 한 시간 안에 알림'은 약속하지 않는다:
    # 실제 감지 지연은 몇 시간이다. 한 번 돌 때의 판정(35분 기준)은 그대로 정확하다.
    # 정각(:00)은 GitHub 예약 실행이 가장 몰려 늦거나 빠지는 시각이라 피한다(효과는 main 반영 뒤 실행 간격으로
    # 확인할 일). 28분은 pg_cron 주 호출(:x3)과 보충 호출(:x6)이 끝난 뒤라 직전 버킷이 이미 들어와 있을
    # 시각이다(20260824130000 마이그레이션). 시간 단위 감지가 필요해지면 GitHub 스케줄러에 기대지 않는 두 번째
    # 발화원(pg_cron 쪽 확인·외부 업타임 핑)을 둔다. (schedule 은 기본 브랜치에서만 발화한다.)
    - cron: "28 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-demand-alert
  cancel-in-progress: true

jobs:
  check:
    name: check snapshot freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 값이 아니라 '둘 다 있는가'만 잡 전체에 둔다 — 키 자체는 Supabase 를 읽는 스텝에만 넘긴다.
      SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      SERVICE_TOKEN: ${{ secrets.SERVICE_API_TOKEN || secrets.ADMIN_API_TOKEN }}
    steps:
      - name: Check snapshot freshness (Supabase)
        if: ${{ env.SUPABASE_CONFIGURED == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AREA_DEMAND_ALERT_ALLOW_EMPTY: ${{ vars.AREA_DEMAND_ALERT_ALLOW_EMPTY }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          # app/services/area_demand_reliability_service.py 와 같은 기준 — 두 판정이 갈리지 않게.
          SOURCE = "gyeongju_its"
          BUCKET_MINUTES = 10
          DOWN_AFTER_MINUTES = 35  # _ALERT_DOWN_AFTER_MINUTES

          base = os.environ["SUPABASE_URL"].strip().rstrip("/")
          # 붙여 넣을 때 딸려 온 줄바꿈·공백은 헤더를 깨뜨린다(09-27 Render 키 사례) — 걷어 낸다.
          key = "".join(os.environ["SUPABASE_SERVICE_ROLE_KEY"].split())
          # 공백을 걷어도 남는 보이지 않는 글자(U+200B 폭 없는 공백 등)는 헤더에 실리지 않아 http.client 가
          # UnicodeEncodeError·ValueError 트레이스백으로 죽는다 — 판정 줄도 Summary 도 없이. 요청 전에 걸러
          # api_unreachable 로 알린다. 키·주소 값은 출력하지 않고, 문제 글자의 위치와 코드포인트만 말한다.
          # Supabase 키(sb_secret_…·JWT)와 프로젝트 주소는 인쇄 가능한 ASCII(U+0021~U+007E)만 쓴다.
          invalid = None
          for secret_name, value, bad_reason in (("SUPABASE_SERVICE_ROLE_KEY", key, "invalid_key_chars"),
                                                 ("SUPABASE_URL", base, "invalid_url_chars")):
              bad = next(((i, ord(c)) for i, c in enumerate(value) if not "!" <= c <= "~"), None)
              if bad is not None:
                  invalid = (secret_name, bad_reason, bad[0] + 1, bad[1])
                  break
          # 빈 표를 통과시키는 것은 명시적으로 켠 새 환경뿐이다(위 머리말 no_snapshot).
          allow_empty = os.environ.get("AREA_DEMAND_ALERT_ALLOW_EMPTY", "").strip().lower() == "true"
          query = urllib.parse.urlencode({
              "select": "bucket_at,observed_at",
              "source": f"eq.{SOURCE}",
              "bucket_minutes": f"eq.{BUCKET_MINUTES}",
              "order": "bucket_at.desc",
              "limit": "1",
          })
          request = urllib.request.Request(
              f"{base}/rest/v1/area_demand_snapshots?{query}",
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Accept": "application/json"},
          )


          def fetch():
              """(HTTP 상태, 본문). 연결 실패는 상태 0. 429·5xx·연결 실패만 15초 간격으로 3회까지 묻는다."""
              status, body = 0, b""
              for attempt in range(3):
                  if attempt:
                      time.sleep(15)
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.status, response.read()
                  except urllib.error.HTTPError as error:
                      try:
                          body = error.read()
                      except (OSError, http.client.HTTPException):
                          body = b""  # 오류 본문은 안내용일 뿐 — 못 읽어도 상태 코드로 판정한다
                      status = error.code
                      if error.code != 429 and error.code < 500:
                          break  # 401·403·404 는 다시 물어도 같다
                  # URLError·타임아웃·연결 거부(OSError), 본문이 중간에 끊김(IncompleteRead 등 HTTPException —
                  # OSError 가 아니다). 트레이스백으로 끝나지 않고 다시 묻는다.
                  except (OSError, http.client.HTTPException) as error:
                      status, body = 0, f"{type(error).__name__}: {error}".encode()
              return status, body


          status, body = (0, b"") if invalid else fetch()
          now = datetime.now(timezone.utc)
          age = bucket = None
          if invalid:
              # 요청을 보내지 않았다 — 키·주소를 헤더·요청 줄에 실을 수 없다.
              state, reason = "api_unreachable", invalid[1]
          elif status != 200:
              # 본문은 200 일 때만 읽는다 — 오류 응답을 스냅샷으로 해석하지 않는다.
              state, reason = "api_unreachable", (f"http_{status}" if status else "connection_failed")
          else:
              try:
                  rows = json.loads(body)
                  if rows:
                      latest = rows[0]
                      bucket = latest["bucket_at"]
                      observed = datetime.fromisoformat(latest["observed_at"].replace("Z", "+00:00"))
                      age = round((now - observed).total_seconds() / 60, 1)
              except (ValueError, KeyError, TypeError, AttributeError):
                  state, reason = "api_unreachable", "invalid_body"
              else:
                  if bucket is None:
                      state, reason = ("unknown", "no_snapshot") if allow_empty else ("no_snapshot", "empty_result")
                  elif age > DOWN_AFTER_MINUTES:
                      state, reason = "stale", "stale_snapshot"
                  else:
                      state, reason = "ok", "-"

          print(f"state={state} reason={reason} age_minutes={age} bucket_at={bucket}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(
                      f"### 주차 실측 수집 상태: `{state}` (Supabase 직접 확인)\n\n"
                      f"- 사유: `{reason}`\n- 최신 스냅샷 경과: `{age}`분\n- 최신 버킷: `{bucket}`\n"
                  )

          if state == "ok":
              print("수집 정상.")
          elif state == "unknown":
              # AREA_DEMAND_ALERT_ALLOW_EMPTY=true 로 켠 갓 배포 환경. 경보가 아니다.
              print("이력이 없어 판정하지 않습니다(신규 환경 — AREA_DEMAND_ALERT_ALLOW_EMPTY=true).")
          elif state == "no_snapshot":
              print(f"::error::Supabase 는 답했지만 주차 실측 스냅샷이 한 건도 보이지 않습니다 (reason={reason}).")
              print("운영 표에는 8월부터 행이 있으므로 수집보다 '읽기'를 먼저 의심하세요:")
              print("  1) Actions Secret SUPABASE_SERVICE_ROLE_KEY 가 service_role 키인가 — anon 키면 RLS 때문에 오류 없이 0행이다.")
              print(f"  2) 수집이 쓰는 source·bucket_minutes 가 이 확인의 값(source={SOURCE}, bucket_minutes={BUCKET_MINUTES})과 같은가.")
              print("  3) Supabase SQL Editor: select count(*), max(observed_at) from area_demand_snapshots;")
              print("스냅샷이 아직 없는 새 환경이면 Repository Variable AREA_DEMAND_ALERT_ALLOW_EMPTY=true 로 통과시킨다.")
              sys.exit(1)
          elif state == "stale":
              print(f"::error::주차 실측 수집이 멈췄습니다 (reason={reason}, 최신 스냅샷 {age}분 전).")
              print("")
              print("확인 순서 — Supabase SQL Editor:")
              print("  1) select id, status_code, left(coalesce(error_msg, content), 200), created")
              print("       from net._http_response order by created desc limit 10;")
              print("     → 401 이면 Vault 토큰이 Render 의 SERVICE_API_TOKEN/ADMIN_API_TOKEN 과 다르다.")
              print("  2) select jobname, active from cron.job where jobname like 'nextspot-area-demand%';")
              print("     → active=false 면 예약이 풀린 것이다.")
              print("")
              print("토큰 재설정:")
              print("  select public.configure_area_demand_collection('<수집 URL>', '<현재 토큰>');")
              sys.exit(1)
          else:
              print(f"::error::Supabase 에서 스냅샷 표를 읽지 못했습니다 (reason={reason}) — 수집이 멈췄다는 뜻은 아닙니다.")
              if invalid:
                  secret_name, _, position, code_point = invalid
                  print(f"Actions Secret {secret_name} 의 {position}번째 글자(공백을 걷은 값 기준)가 U+{code_point:04X} 라 "
                        "HTTP 요청에 실을 수 없어 요청을 보내지 않았습니다.")
                  print("붙여 넣을 때 딸려 온 보이지 않는 글자(U+200B 폭 없는 공백 등)일 수 있습니다 — 시크릿 값을 다시 붙여 넣으세요.")
                  sys.exit(1)
              print("401·403 이면 Actions Secret SUPABASE_URL·SUPABASE_SERVICE_ROLE_KEY 값을,")
              print("5xx·connection_failed 면 Supabase 프로젝트 상태(일시 정지·장애)를 확인하세요.")
              # 키·주소는 로그에 남기지 않는다 — 응답이 되비추는 경우까지 걷어 낸다(GitHub 마스킹과 별개).
              excerpt = body.decode("utf-8", "replace")
              for secret in (key, base):
                  if secret:
                      excerpt = excerpt.replace(secret, "***")
              print(f"응답 앞부분: {excerpt[:200]}")
              sys.exit(1)
          PY

      # 아래 둘은 Supabase 시크릿이 없을 때의 예전 방식(API 판정) 그대로다.
      - name: Skip (설정 없음)
        if: ${{ env.SUPABASE_CONFIGURED != 'true' && (env.BACKEND_HEALTH_URL == '' || env.SERVICE_TOKEN == '') }}
        run: echo "Supabase 시크릿도, BACKEND_HEALTH_URL·SERVICE_API_TOKEN 도 없어 확인을 건너뜁니다."

      - name: Check collection health (API)
        if: ${{ env.SUPABASE_CONFIGURED != 'true' && env.BACKEND_HEALTH_URL != '' && env.SERVICE_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          api_base="${BACKEND_HEALTH_URL%/health}"
          # Render 무료 플랜은 콜드 스타트가 있다 — 재시도로 흡수한다(깨우는 데 실패하는 것과
          # 수집이 죽은 것은 다른 문제이므로, 여기서 성급히 실패로 단정하지 않는다).
          body="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 --max-time 120 \
            -H "X-Service-Token: ${SERVICE_TOKEN}" \
            "${api_base}/api/v1/admin/area-demand-reliability?hours=6")"

          state="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["alert"]["state"])')"
          reason="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["alert"].get("reason") or "-")')"
          age="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["alert"].get("age_minutes"))')"

          echo "state=${state} reason=${reason} age_minutes=${age}"
          {
            echo "### 주차 실측 수집 상태: \`${state}\`"
            echo ""
            echo "- 사유: \`${reason}\`"
            echo "- 최신 스냅샷 경과: \`${age}\`분"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$state" in
            ok)
              echo "수집 정상." ;;
            unknown)
              # 표가 비어 있는 갓 배포 환경. 경보가 아니다.
              echo "이력이 없어 판정하지 않습니다(신규 환경)." ;;
            degraded)
              echo "::warning::수집이 간헐적으로 실패하고 있습니다 (reason=${reason})."
              echo "지금은 살아 있으나 창 전체에서 누락이 잦습니다 — 확인이 필요합니다." ;;
            *)
              echo "::error::주차 실측 수집이 멈췄습니다 (reason=${reason}, 최신 스냅샷 ${age}분 전)."
              echo ""
              echo "확인 순서 — Supabase SQL Editor:"
              echo "  1) select id, status_code, left(coalesce(error_msg, content), 200), created"
              echo "       from net._http_response order by created desc limit 10;"
              echo "     → 401 이면 Vault 토큰이 Render 의 SERVICE_API_TOKEN/ADMIN_API_TOKEN 과 다르다."
              echo "  2) select jobname, active from cron.job where jobname like 'nextspot-area-demand%';"
              echo "     → active=false 면 예약이 풀린 것이다."
              echo ""
              echo "토큰 재설정:"
              echo "  select public.configure_area_demand_collection('<수집 URL>', '<현재 토큰>');"
              exit 1 ;;
          esac
